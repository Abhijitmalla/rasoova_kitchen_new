<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="muttonGravy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>
    <filter id="muttonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#471822" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="160" height="160" rx="16" fill="#fff5f7"/>

  <g filter="url(#muttonShadow)">
    <!-- Royal Copper Handi with Brass Handles -->
    <!-- Brass Ear Handles -->
    <ellipse cx="24" cy="80" rx="6" ry="12" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <ellipse cx="136" cy="80" rx="6" ry="12" fill="#d97706" stroke="#92400e" stroke-width="2"/>

    <!-- Copper Bowl -->
    <ellipse cx="80" cy="85" rx="56" ry="44" fill="#9a3412" stroke="#7c2d12" stroke-width="2.5"/>
    <ellipse cx="80" cy="80" rx="52" ry="40" fill="#c2410c"/>
    <ellipse cx="80" cy="76" rx="48" ry="36" fill="url(#muttonGravy)"/>

    <!-- Rich Rogan Josh / Mutton Chunks with bone marrow -->
    <!-- Meat chunk 1 -->
    <path d="M58 70c-4-5 2-12 10-10 6 2 10 8 8 14-3 5-13 4-18-4z" fill="#701a75" stroke="#4a044e" stroke-width="1.5"/>
    <circle cx="64" cy="68" r="3" fill="#fdf2f8"/>

    <!-- Meat chunk 2 (Center) -->
    <path d="M78 68c-2-6 8-12 16-8 7 3 8 12 4 16-5 4-16 2-20-8z" fill="#581c87" stroke="#3b0764" stroke-width="1.5"/>
    <circle cx="86" cy="72" r="3.5" fill="#fdf2f8"/>

    <!-- Meat chunk 3 (Right) -->
    <path d="M96 76c-3-5 5-11 12-8 5 2 7 9 4 12-4 3-12 2-16-4z" fill="#701a75" stroke="#4a044e" stroke-width="1.5"/>

    <!-- Red Rogan Josh Oil Slick & Ginger Juliennes -->
    <path d="M62 84c8 3 24 3 34-1" stroke="#dc2626" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M70 64l8 6M88 62l6 8M66 78l8-2" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>

    <!-- Fresh Green Chili & Coriander -->
    <path d="M72 86c5-2 12 1 14 6" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="84" cy="82" r="2" fill="#22c55e"/>
  </g>
</svg>
