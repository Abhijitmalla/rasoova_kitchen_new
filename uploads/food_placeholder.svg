<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#fcebee"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a82346"/>
      <stop offset="100%" stop-color="#73102c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b193d" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="120" height="120" rx="16" fill="url(#bgGrad)" stroke="#f2d9de" stroke-width="1.5"/>
  
  <!-- Food Cloche / Plate Silhouette -->
  <g filter="url(#shadow)">
    <!-- Cloche handle -->
    <circle cx="60" cy="33" r="5" fill="#c73859"/>
    
    <!-- Cloche dome -->
    <path d="M60 38c-1.5 0-2.8.8-3.4 2C42.8 41.5 32 52.8 32 66.5h56c0-13.7-10.8-25-24.6-26.5-.6-1.2-1.9-2-3.4-2z" fill="url(#primaryGrad)"/>
    
    <!-- Cloche highlight -->
    <path d="M42 62c2-8 8-15 16-17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4" fill="none"/>
    
    <!-- Base Plate -->
    <rect x="26" y="69.5" width="68" height="5.5" rx="2.75" fill="#c73859"/>
    <rect x="20" y="77" width="80" height="4" rx="2" fill="#e0a8b6"/>
  </g>
  
  <!-- Subtle steam accents -->
  <path d="M48 27c-2-3 2-6 0-9" stroke="#c78b9b" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M60 25c-2-3 2-6 0-9" stroke="#8b193d" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M72 27c-2-3 2-6 0-9" stroke="#c78b9b" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
