<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="paneerGravy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <filter id="curryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#471822" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="160" height="160" rx="16" fill="#fff5f7"/>

  <g filter="url(#curryShadow)">
    <!-- Serving Handi Bowl -->
    <ellipse cx="80" cy="85" rx="56" ry="44" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <ellipse cx="80" cy="80" rx="52" ry="40" fill="#475569"/>
    <ellipse cx="80" cy="76" rx="48" ry="36" fill="url(#paneerGravy)"/>

    <!-- Fresh Paneer Cubes with 3D bevel -->
    <!-- Cube 1 (Center) -->
    <path d="M70 65l14-4 12 5-14 4z" fill="#ffffff"/>
    <path d="M70 65v12l12 5V70z" fill="#f1f5f9"/>
    <path d="M82 70l14-5v12l-14 5z" fill="#e2e8f0"/>

    <!-- Cube 2 (Left) -->
    <path d="M48 76l12-3 10 4-12 3z" fill="#ffffff"/>
    <path d="M48 76v10l10 4V80z" fill="#f1f5f9"/>
    <path d="M58 80l12-4v10l-12 4z" fill="#e2e8f0"/>

    <!-- Cube 3 (Right) -->
    <path d="M96 75l12-3 10 4-12 3z" fill="#ffffff"/>
    <path d="M96 75v10l10 4V79z" fill="#f1f5f9"/>
    <path d="M106 79l12-4v10l-12 4z" fill="#e2e8f0"/>

    <!-- Fresh Cream Swirl -->
    <path d="M60 62c12-6 28 2 24 16-3 10-18 12-22 6" stroke="#fffdfa" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- Fresh Green Coriander Garnishes -->
    <circle cx="78" cy="62" r="2" fill="#16a34a"/>
    <circle cx="84" cy="66" r="2.5" fill="#15803d"/>
    <circle cx="92" cy="62" r="1.8" fill="#16a34a"/>
    <circle cx="68" cy="78" r="2.2" fill="#15803d"/>
  </g>
</svg>
